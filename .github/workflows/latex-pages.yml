name: Compilar LaTeX y publicar visor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar LaTeX con Comic Sans MS
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          os: debian
          latexmk_use_xelatex: true
          extra_system_packages: "cabextract curl fontconfig"
          pre_compile: |
            mkdir -p /usr/local/share/fonts/comicsans
            curl -fLsS --retry 3 -o /tmp/comic32.exe "https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/comic32.exe"
            cabextract -L -d /usr/local/share/fonts/comicsans /tmp/comic32.exe
            fc-cache -f
            fc-match "Comic Sans MS"
          args: -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp main.pdf _site/main.pdf
          cp web/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
